{% extends "base.html" %}

{% block title %}Login | NextStop{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post">
    <div>
        <label for="email">Email</label>

        <input
            id="email"
            name="email"
            type="email"
            value="{{ email or '' }}"
            required
        />
    </div>

    <div>
        <label for="password">Password</label>

        <input
            id="password"
            name="password"
            type="password"
            required
        />
    </div>

    <button type="submit">Log in</button>
</form>
{% endblock %}
