{% extends "base.html" %}

{% block title %}Login | NextStop{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-container">
        <div class="login-form">
            <h1>Welcome back!</h1>

            <p class="login-description">Log in to continue exploring Montreal and access your itineraries.</p>

            <form method="post">
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        value="{{ email or '' }}"
                        placeholder="Enter your email"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <button type="submit" class="login-submit">Log in</button>
            </form>

            <p class="switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Sign up</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
