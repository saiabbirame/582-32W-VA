{% extends "base.html" %}

{% block title %}Register | NextStop{% endblock %}

{% block content %}
<section class="register-page">
    <div class="register-container">
        <div class="register-form">
            <h1>Create an account</h1>

            <p class="register-description">Sign up to start exploring Montreal and creating your own itineraries.</p>

            <form method="post">
                <div class="form-group">
                    <label for="first-name">First Name</label>

                    <input
                        id="first-name"
                        name="first_name"
                        type="text"
                        maxlength="50"
                        value="{{ first_name or '' }}"
                        placeholder="Enter your first name"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>

                    <input
                        id="last-name"
                        name="last_name"
                        type="text"
                        maxlength="50"
                        value="{{ last_name or '' }}"
                        placeholder="Enter your last name"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="255"
                        value="{{ email or '' }}"
                        placeholder="Enter your email"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="20"
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <button type="submit" class="register-submit">Create account</button>
            </form>

            <p class="switch">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
