{% extends "base.html" %}

{% block title %}Register | NextStop{% endblock %}

{% block content %}
<h1>Create an account</h1>

<form method="post">
    <div>
        <label for="first-name">First Name</label>

        <input
            id="first-name"
            name="first_name"
            type="text"
            maxlength="50"
            value="{{ first_name or '' }}"
            required
        />
    </div>

    <div>
        <label for="last-name">Last Name</label>

        <input
            id="last-name"
            name="last_name"
            type="text"
            maxlength="50"
            value="{{ last_name or '' }}"
            required
        />
    </div>

    <div>
        <label for="email">Email</label>

        <input
            id="email"
            name="email"
            type="email"
            maxlength="255"
            value="{{ email or '' }}"
            required
        />
    </div>

    <div>
        <label for="password">Password</label>

        <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            maxlength="20"
            required
        />
    </div>

    <button type="submit">Create account</button>
</form>
{% endblock %}
