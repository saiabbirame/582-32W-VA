{% extends "base.html" %}

{% block title %}New Itinerary | NextStop{% endblock %}

{% block content %}
<section class="create-itinerary-page">
    <div class="create-itinerary-wrapper">
        <a href="{{ url_for('itineraries' )}}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to my itineraries
        </a>

        <div class="create-itinerary-container">
            <h1>Create an itinerary</h1>

            <p class="create-itinerary-description">Start planning your Montreal adventure.</p>
        
            <form method="post">
                <div class="form-group">
                    <label for="title">Title</label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        maxlength="100"
                        value="{{ title or '' }}"
                        placeholder="Enter an itinerary title"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        value="{{ date or '' }}"
                        required
                    />
                </div>

                <button type="submit" class="create-itinerary-submit">Create itinerary</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
