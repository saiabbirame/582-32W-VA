{% extends "base.html" %}

{% block title %}Add Place | NextStop{% endblock %}

{% block content %}
<section class="admin-place-form-page">
    <a href="{{ url_for('admin_places') }}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Back to manage places
    </a>

    <div class="admin-place-form-container">
        <h1>Add Place</h1>

        <p class="admin-place-form-description">
            Add a new place to NextStop.
        </p>

        <form method="post">
            <div class="form-group">
                <label for="name">Name</label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category</label>

                <select
                    id="category"
                    name="category"
                    required
                >
                    <option value="">Select a category</option>
                    <option value="Restaurants">Restaurants</option>
                    <option value="Cafés">Cafés</option>
                    <option value="Attractions">Attractions</option>
                    <option value="Parks">Parks</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                </select>
            </div>

            <div class="form-group">
                <label for="neighbourhood">Neighbourhood</label>

                <input
                    id="neighbourhood"
                    name="neighbourhood"
                    type="text"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <input
                    id="address"
                    name="address"
                    type="text"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="opening-hours">Opening Hours</label>

                <input
                    id="opening-hours"
                    name="opening_hours"
                    type="text"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="image-url">Image URL</label>

                <input
                    id="image-url"
                    name="image_url"
                    type="text"
                    maxlength="500"
                    required
                >
            </div>

            <div class="form-group">
                <label for="latitude">Latitude</label>

                <input
                    id="latitude"
                    name="latitude"
                    type="number"
                    step="any"
                    required
                >
            </div>

            <div class="form-group">
                <label for="longitude">Longitude</label>

                <input
                    id="longitude"
                    name="longitude"
                    type="number"
                    step="any"
                    required
                >
            </div>

            <button type="submit" class="admin-place-submit">
                Add Place
            </button>
        </form>
    </div>
</section>
{% endblock %}
